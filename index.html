<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="可離線使用的影視資料庫，支援搜尋、篩選、收藏及觀看狀態。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<title>我的影視資料庫</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c2f;--panel2:#1b2740;--text:#eef3ff;--muted:#aab7d0;--line:#2d3a55;--accent:#8bb7ff;--good:#9be2c0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#10182b,var(--bg) 360px);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}
button,.filebtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:11px;cursor:pointer;min-height:40px}button:hover,.filebtn:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding:22px max(16px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:clamp(23px,4vw,32px);margin:0}header p{color:var(--muted);margin:4px 0 0}.action-menu{position:relative}.action-menu>summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--panel2);padding:9px 13px;border-radius:11px}.action-menu>summary::-webkit-details-marker{display:none}.action-panel{position:absolute;z-index:5;right:0;top:calc(100% + 8px);width:min(310px,calc(100vw - 24px));padding:10px;background:#111b2e;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 48px #0009;display:grid;gap:8px}.action-panel button,.action-panel .filebtn{display:flex;width:100%;text-align:left;align-items:center;text-decoration:none}.action-panel .primary{background:var(--accent);color:#0b1426;font-weight:700}
.wrap{max-width:1200px;margin:auto;padding:0 16px 42px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 14px}.stat,.filters,.toolbar,.item{background:rgba(20,28,47,.94);border:1px solid var(--line);border-radius:15px}.stat{padding:12px 15px}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}
.filters{padding:14px;margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;background:#0d1527;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px;min-height:41px}.search-row{display:flex;gap:10px;align-items:end}.search-row .field{flex:1}.filter-heading{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}.filter-heading span,.hint{color:var(--muted);font-size:12px}.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.filter-setting{padding:10px;border:1px solid var(--line);border-radius:11px;background:#10192b}.filter-setting:not(.favorite):not(.expanded){display:none}.setting-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--muted);font-size:12px}.favorite-btn{min-height:30px;padding:2px 8px;color:var(--accent);font-size:17px}.checkline{display:flex;gap:12px;flex-wrap:wrap}.checkline label{display:flex;align-items:center;gap:5px;color:var(--text);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;margin-bottom:11px;flex-wrap:wrap}.toolbar .right{display:flex;gap:8px;align-items:center}.toolbar select{background:#0d1527;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.item{padding:14px;display:flex;flex-direction:column;gap:7px;min-width:0}.item h2{font-size:18px;line-height:1.35;margin:0;overflow-wrap:anywhere}.original,.details{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.details{display:grid;gap:4px}.details b{color:var(--text)}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:11px;color:#c0d7ff;border:1px solid #344a6b;background:#192943;padding:2px 7px;border-radius:999px}.locations{border-top:1px solid var(--line);padding-top:8px;margin-top:auto;font-size:13px;color:var(--muted)}.cardactions{display:flex;gap:6px}.cardactions button{flex:1;font-size:12px;padding:6px;min-height:36px}.on{color:var(--good);border-color:#396f5d}.empty{padding:44px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;grid-column:1/-1}.notice{font-size:12px;color:var(--muted);margin:12px 2px}.filebtn{display:inline-flex;align-items:center;justify-content:center}.hidden{display:none!important}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e8f0ff;color:#111827;border-radius:11px;padding:9px 15px;box-shadow:0 8px 30px #0008;z-index:8;max-width:90vw}footer{text-align:center;color:var(--muted);font-size:12px;padding:14px}
@media(max-width:850px){.results{grid-template-columns:repeat(2,minmax(0,1fr))}.settings{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){header{padding:16px 12px;flex-wrap:nowrap;align-items:flex-start}h1{font-size:20px}.action-menu>summary{font-size:13px;white-space:nowrap}.wrap{padding:0 11px 30px}.stats{gap:6px}.stat{padding:9px}.stat strong{font-size:18px}.stat span{font-size:10px}.filters{padding:11px}.search-row{align-items:stretch;flex-direction:column}.settings{grid-template-columns:1fr}.results{grid-template-columns:1fr}.toolbar{align-items:flex-start}.toolbar .right{width:100%}.toolbar select{flex:1;min-width:0}}
</style>
</head>
<body>
<header>
  <div><h1>🎬 我的影視資料庫</h1><p>離線搜尋、篩選、收藏與管理你的劇集</p></div>
  <details class="action-menu"><summary>☰ 資料管理 ▾</summary><div class="action-panel">
    <button id="loadCsvBtn" type="button">🔄 載入隨附 CSV</button>
    <label class="filebtn" for="csvInput">📄 從裝置匯入 CSV</label><input id="csvInput" type="file" accept=".csv,text/csv" class="hidden">
    <button class="primary" id="fullExportBtn" type="button">🗃️ 匯出完整備份（JSON）</button>
    <label class="filebtn" for="backupJsonInput">📥 匯入完整備份（JSON）</label><input id="backupJsonInput" type="file" accept=".json,application/json" class="hidden">
    <hr>
    <button id="supabaseConfigBtn" type="button">⚙️ Supabase 連線設定</button>
    <div class="field"><label for="backupEmail">備份 email（還原時使用同一 email）</label><input id="backupEmail" type="email" autocomplete="email" placeholder="name@example.com"></div>
    <button class="primary" id="supabaseBackupBtn" type="button">☁️ 以此 email 備份</button>
    <button id="supabaseRestoreBtn" type="button">⬇️ 以此 email 還原</button>
    <button id="installBtn" class="hidden" type="button">📲 安裝 App</button>
  </div></details>
</header>
<main class="wrap">
  <section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>資料庫作品</span></div><div class="stat"><strong id="shownCount">0</strong><span>目前篩選結果</span></div><div class="stat"><strong id="favCount">0</strong><span>我的收藏</span></div></section>
  <section class="filters" aria-label="搜尋與篩選">
    <div class="search-row"><div class="field"><label for="search">關鍵字搜尋</label><input id="search" placeholder="劇名、原文、演員、類型、備份位置…" autocomplete="off"></div><button id="resetBtn" type="button">清除篩選</button></div>
    <div class="filter-heading"><span>其他篩選設定（☆ 收藏設定；收合時只顯示收藏項目）</span><button id="filtersToggle" type="button" aria-expanded="false">展開設定</button></div>
    <div class="settings" id="settings">
      <div class="filter-setting" data-setting="typeFilter"><div class="setting-title"><label for="typeFilter">作品類型</label><button class="favorite-btn" type="button" aria-label="收藏作品類型設定" title="收藏此設定">☆</button></div><select id="typeFilter"><option value="">全部作品類型</option></select></div>
      <div class="filter-setting" data-setting="actorFilter"><div class="setting-title"><label for="actorFilter">演員／聲優</label><button class="favorite-btn" type="button" aria-label="收藏演員／聲優設定" title="收藏此設定">☆</button></div><select id="actorFilter"><option value="">全部演員／聲優</option></select></div>
      <div class="filter-setting" data-setting="themeFilter"><div class="setting-title"><label for="themeFilter">題材</label><button class="favorite-btn" type="button" aria-label="收藏題材設定" title="收藏此設定">☆</button></div><select id="themeFilter"><option value="">全部題材</option></select></div>
      <div class="filter-setting" data-setting="languageFilter"><div class="setting-title"><label for="languageFilter">語言</label><button class="favorite-btn" type="button" aria-label="收藏語言設定" title="收藏此設定">☆</button></div><select id="languageFilter"><option value="">全部語言</option></select></div>
      <div class="filter-setting" data-setting="yearFilter"><div class="setting-title"><label for="yearFilter">年份</label><button class="favorite-btn" type="button" aria-label="收藏年份設定" title="收藏此設定">☆</button></div><select id="yearFilter"><option value="">全部年份</option></select></div>
      <div class="filter-setting" data-setting="statusFilter"><div class="setting-title"><span>狀態</span><button class="favorite-btn" type="button" aria-label="收藏狀態設定" title="收藏此設定">☆</button></div><div class="checkline"><label><input id="favOnly" type="checkbox">只看收藏</label><label><input id="watchedOnly" type="checkbox">已觀看</label><label><input id="unwatchedOnly" type="checkbox">未觀看</label></div></div>
    </div>
  </section>
  <section class="toolbar"><span id="resultLabel">載入資料後開始使用</span><div class="right"><label for="sortSelect" class="hidden">排序</label><select id="sortSelect"><option value="title">中文名稱排序</option><option value="yearDesc">年份：新到舊</option><option value="yearAsc">年份：舊到新</option><option value="episodesDesc">集數：多到少</option><option value="episodesAsc">集數：少到多</option></select><button id="viewBtn" type="button">切換列表</button></div></section>
  <section id="results" class="results" aria-live="polite"></section>
  <p class="notice">作品、收藏與觀看狀態預設只儲存在本機。使用 email 雲端備份時，資料會傳送至你設定的 Supabase；email 只是備份識別碼，不是登入驗證。建議定期匯出 JSON 備份。</p>
</main>
<footer>影視資料庫 PWA · 離線可用 · 不載入外部 CDN</footer>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const DBKEY='dramalist_pwa_v1',METAKEY='dramalist_meta_v1',FAVKEY='dramalist_filter_favorites_v1',SBKEY='dramalist_supabase_config_v2';
const COLS=['中文名稱','英文名稱 / 原文名稱','類形','年份','集數','語言','主要演員 / 聲優','Media Type','Backup 1','backup 2'];
const $=id=>document.getElementById(id);
let rows=[],meta={},listView=false,settingsExpanded=false,installPrompt=null;
function toast(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3000)}
function norm(value){return String(value??'').trim()}
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(value=>value.trim()))out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);if(row.some(value=>value.trim()))out.push(row)}if(!out.length)return[];const headers=out.shift().map(value=>value.trim());if(!headers.includes(COLS[0]))throw Error('找不到「中文名稱」欄位');return out.map(values=>Object.fromEntries(headers.map((header,index)=>[header,norm(values[index])]))).map(record=>Object.fromEntries(COLS.map(column=>[column,norm(record[column])]))).filter(record=>COLS.some(column=>record[column]))}
function get(record,column){return norm(record[column])}
function keyFor(record){return[get(record,COLS[0]),get(record,COLS[1]),get(record,COLS[3])].join('|').toLocaleLowerCase()}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(rows));localStorage.setItem(METAKEY,JSON.stringify(meta))}catch(error){toast('本機儲存失敗：'+error.message)}}
function load(){try{rows=JSON.parse(localStorage.getItem(DBKEY)||'[]');meta=JSON.parse(localStorage.getItem(METAKEY)||'{}');if(!Array.isArray(rows)||!meta||typeof meta!=='object')throw Error('資料格式不正確')}catch(error){rows=[];meta={};toast('讀取本機資料失敗：'+error.message)}}
function tags(record,column){return [...new Set(get(record,column).split(/[、,，;；|／/]+/).map(value=>value.trim()).filter(Boolean))]}
const TYPE_ALIASES=new Map([['電影','電影'],['電影版','電影'],['日影','電影'],['韓影','電影'],['港影','電影'],['台影','電影'],['movie','電影'],['movies','電影'],['film','電影'],['日劇','日劇'],['日本劇','日劇'],['韓劇','韓劇'],['韓國劇','韓劇'],['美劇','美劇'],['美國劇','美劇'],['台劇','台劇'],['台灣劇','台劇'],['港劇','港劇'],['香港劇','港劇'],['中劇','陸劇'],['陸劇','陸劇'],['中國劇','陸劇'],['泰劇','泰劇'],['英劇','英劇'],['法劇','法劇'],['德劇','德劇'],['網劇','網劇'],['電視劇','電視劇'],['動畫','動畫'],['動漫','動畫'],['anime','動畫'],['ova','動畫'],['綜藝','綜藝'],['番組','綜藝'],['紀錄片','紀錄片'],['紀錄','紀錄片'],['特攝','特攝'],['舞台劇','舞台劇'],['劇場版','電影'],['tv show','電視節目'],['series','電視劇'],['drama','電視劇']]);
function typeTags(record){return [...new Set([...tags(record,COLS[2]),...tags(record,COLS[7])].map(value=>TYPE_ALIASES.get(value.toLocaleLowerCase())).filter(Boolean).concat(tags(record,COLS[6]).some(value=>/^tvb$/i.test(value))?['TVB']:[]))]}
function themeTags(record){return tags(record,COLS[2]).filter(value=>!TYPE_ALIASES.has(value.toLocaleLowerCase()))}
function actorTags(record){return tags(record,COLS[6]).filter(value=>!/^tvb$/i.test(value))}
function isFav(record){return !!meta[keyFor(record)]?.fav}
function isWatched(record){return !!meta[keyFor(record)]?.watched}
function setOptions(id,values,first){const select=$(id),previous=select.value;select.innerHTML=`<option value="">${first}</option>`+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true})).map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('');if([...select.options].some(option=>option.value===previous))select.value=previous}
function refreshOptions(){setOptions('typeFilter',rows.flatMap(typeTags),'全部作品類型');setOptions('actorFilter',rows.flatMap(actorTags),'全部演員／聲優');setOptions('themeFilter',rows.flatMap(themeTags),'全部題材');setOptions('languageFilter',rows.map(record=>get(record,COLS[5])),'全部語言');setOptions('yearFilter',rows.map(record=>get(record,COLS[3])),'全部年份')}
function filterFavorites(){try{const saved=JSON.parse(localStorage.getItem(FAVKEY)||'[]');return new Set(Array.isArray(saved)?saved:[])}catch(error){toast('讀取篩選收藏失敗：'+error.message);return new Set()}}
function applyFilterFavorites(){const favorites=filterFavorites();document.querySelectorAll('.filter-setting').forEach(setting=>{const favorite=favorites.has(setting.dataset.setting);setting.classList.toggle('favorite',favorite);const button=setting.querySelector('.favorite-btn');button.textContent=favorite?'★':'☆';button.setAttribute('aria-pressed',String(favorite));if(!settingsExpanded)setting.classList.remove('expanded');else setting.classList.add('expanded')})}
function filtered(){const query=$('search').value.trim().toLocaleLowerCase();const selected={type:$('typeFilter').value,actor:$('actorFilter').value,theme:$('themeFilter').value,language:$('languageFilter').value,year:$('yearFilter').value};const result=rows.filter(record=>{const all=COLS.map(column=>get(record,column)).join(' ').toLocaleLowerCase();return(!query||all.includes(query))&&(!selected.type||typeTags(record).includes(selected.type))&&(!selected.actor||actorTags(record).includes(selected.actor))&&(!selected.theme||themeTags(record).includes(selected.theme))&&(!selected.language||get(record,COLS[5])===selected.language)&&(!selected.year||get(record,COLS[3])===selected.year)&&(!$('favOnly').checked||isFav(record))&&(!$('watchedOnly').checked||isWatched(record))&&(!$('unwatchedOnly').checked||!isWatched(record))});const sort=$('sortSelect').value;result.sort((a,b)=>{if(sort==='yearDesc'||sort==='yearAsc'){const difference=(parseInt(get(a,COLS[3]),10)||0)-(parseInt(get(b,COLS[3]),10)||0);return sort==='yearDesc'?-difference:difference}if(sort==='episodesDesc'||sort==='episodesAsc'){const difference=(parseInt(get(a,COLS[4]),10)||0)-(parseInt(get(b,COLS[4]),10)||0);return sort==='episodesDesc'?-difference:difference}return get(a,COLS[0]).localeCompare(get(b,COLS[0]),'zh-Hant',{numeric:true})});return result}
function card(record){const key=keyFor(record),favorite=isFav(record),watched=isWatched(record);const details=[['年份',COLS[3]],['集數',COLS[4]],['語言',COLS[5]],['主要演員／聲優',COLS[6]]].filter(([,column])=>get(record,column)).map(([label,column])=>`<div><b>${label}：</b>${esc(get(record,column))}</div>`).join('');const chips=[...new Set([get(record,COLS[7]),...typeTags(record),...themeTags(record)].filter(Boolean))].slice(0,8).map(value=>`<span class="chip">${esc(value)}</span>`).join('');return `<article class="item"><div class="chips">${watched?'<span class="chip">已觀看</span>':''}</div><h2>${esc(get(record,COLS[0])||'（未命名）')}</h2>${get(record,COLS[1])?`<div class="original">${esc(get(record,COLS[1]))}</div>`:''}<div class="chips">${chips}</div><div class="details">${details}</div><div class="locations">${get(record,COLS[8])?`<div>📁 <b>Backup 1：</b>${esc(get(record,COLS[8]))}</div>`:''}${get(record,COLS[9])?`<div>💾 <b>Backup 2：</b>${esc(get(record,COLS[9]))}</div>`:''}</div><div class="cardactions"><button data-action="fav" data-key="${esc(key)}" class="${favorite?'on':''}">${favorite?'★ 已收藏':'☆ 收藏'}</button><button data-action="watched" data-key="${esc(key)}" class="${watched?'on':''}">${watched?'✓ 已觀看':'標記已觀看'}</button></div></article>`}
function render(){const result=filtered();$('totalCount').textContent=rows.length.toLocaleString();$('shownCount').textContent=result.length.toLocaleString();$('favCount').textContent=rows.filter(isFav).length.toLocaleString();$('resultLabel').textContent=rows.length?`顯示 ${result.length.toLocaleString()} / ${rows.length.toLocaleString()} 部作品`:'請載入隨附 CSV 或匯入備份';$('results').innerHTML=result.length?result.map(card).join(''):`<div class="empty"><b>${rows.length?'沒有符合條件的作品':'尚未載入資料'}</b><p>${rows.length?'請嘗試其他條件，或清除篩選。':'使用右上角「資料管理」載入同資料夾的 dramalist.csv，或匯入備份。'}</p></div>`;$('results').style.gridTemplateColumns=listView?'1fr':''}
function resetFilters(){['search','typeFilter','actorFilter','themeFilter','languageFilter','yearFilter'].forEach(id=>$(id).value='');['favOnly','watchedOnly','unwatchedOnly'].forEach(id=>$(id).checked=false);render()}
function setRows(nextRows){if(!nextRows.length)throw Error('CSV 沒有可用作品');rows=nextRows;save();refreshOptions();resetFilters();render()}
async function loadBundledCsv(showMessage=true){const response=await fetch('./dramalist.csv',{cache:'no-store'});if(!response.ok)throw Error('讀取本機 dramalist.csv 失敗（HTTP '+response.status+'）');setRows(parseCSV(await response.text()));if(showMessage)toast('已載入隨附 CSV，共 '+rows.length.toLocaleString()+' 部作品')}
$('loadCsvBtn').addEventListener('click',async()=>{try{await loadBundledCsv()}catch(error){toast(error.message+'；若以 file:// 開啟，請改用「從裝置匯入 CSV」')}})
$('csvInput').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{setRows(parseCSV(await file.text()));toast('CSV 匯入成功，共 '+rows.length.toLocaleString()+' 部作品')}catch(error){toast('CSV 匯入失敗：'+error.message)}finally{event.target.value=''}})
function makeBackup(){return{app:'dramalist-pwa',version:1,backupAt:new Date().toISOString(),columns:COLS,rows,meta}}
function downloadJSON(payload,name){const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('fullExportBtn').addEventListener('click',()=>{if(!rows.length){toast('目前沒有作品資料，無法備份');return}downloadJSON(makeBackup(),'dramalist-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('完整備份已匯出')})
$('backupJsonInput').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(payload?.app!=='dramalist-pwa'||!Array.isArray(payload.rows)||!payload.meta||typeof payload.meta!=='object')throw Error('不是有效的影視資料庫完整備份');if(!confirm('匯入會取代目前本機作品、收藏及觀看紀錄。建議先匯出備份。要繼續嗎？'))return;rows=payload.rows.map(record=>Object.fromEntries(COLS.map(column=>[column,norm(record[column])])));meta=payload.meta;save();refreshOptions();resetFilters();render();toast('完整備份已還原：'+rows.length.toLocaleString()+' 部作品')}catch(error){toast('匯入備份失敗：'+error.message)}finally{event.target.value=''}})
function getSBConfig(){try{return JSON.parse(localStorage.getItem(SBKEY)||'null')}catch(error){toast('讀取 Supabase 設定失敗：'+error.message);return null}}
function configureSupabase(){const current=getSBConfig()||{url:'https://wanknivxcsrasdkkxmfr.supabase.co',key:''};const url=prompt('Supabase Project URL',current.url);if(url===null)return null;const key=prompt('Supabase anon/public key（不可使用 service_role/secret key）',current.key);if(key===null)return null;const config={url:url.trim().replace(/\/+$/,''),key:key.trim()};if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(config.url)||!config.key){toast('請輸入有效的 Supabase URL 和 anon key');return null}try{localStorage.setItem(SBKEY,JSON.stringify(config))}catch(error){toast('儲存 Supabase 設定失敗：'+error.message);return null}toast('Supabase 設定已儲存');return config}
function backupEmail(){const email=$('backupEmail').value.trim().toLocaleLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('請先輸入有效的 email');return null}return email}
async function supabaseRequest(method,payload){const config=getSBConfig()||configureSupabase();if(!config)return null;const email=backupEmail();if(!email)return null;const endpoint=config.url+'/rest/v1/notepad_data';const headers={apikey:config.key,Authorization:'Bearer '+config.key,'Content-Type':'application/json',Accept:'application/json'};if(method==='POST'){headers.Prefer='resolution=merge-duplicates,return=minimal';const response=await fetch(endpoint+'?on_conflict=id',{method,headers,body:JSON.stringify({id:email,data:payload,updated_at:new Date().toISOString()})});if(!response.ok)throw Error('Supabase 寫入失敗（HTTP '+response.status+'）；請確認 notepad_data 表格及 RLS 權限');return true}const response=await fetch(endpoint+'?id=eq.'+encodeURIComponent(email)+'&select=data,updated_at',{headers,cache:'no-store'});if(!response.ok)throw Error('Supabase 讀取失敗（HTTP '+response.status+'）；請確認設定及 RLS 權限');const result=await response.json();if(!result.length)throw Error('找不到此 email 的備份');return result[0]}
$('supabaseConfigBtn').addEventListener('click',configureSupabase)
$('supabaseBackupBtn').addEventListener('click',async()=>{if(!rows.length){toast('目前沒有作品資料，無法備份');return}const button=$('supabaseBackupBtn');button.disabled=true;try{if(await supabaseRequest('POST',makeBackup()))toast('已將完整備份綁定至此 email')}catch(error){toast('雲端備份失敗：'+error.message)}finally{button.disabled=false}})
$('supabaseRestoreBtn').addEventListener('click',async()=>{if(!backupEmail())return;if(!confirm('還原會取代目前本機作品、收藏及觀看紀錄。建議先匯出備份。要繼續嗎？'))return;const button=$('supabaseRestoreBtn');button.disabled=true;try{const saved=await supabaseRequest('GET');if(!saved)return;const payload=saved.data;if(payload?.app!=='dramalist-pwa'||!Array.isArray(payload.rows)||!payload.meta||typeof payload.meta!=='object')throw Error('雲端備份格式不正確');rows=payload.rows.map(record=>Object.fromEntries(COLS.map(column=>[column,norm(record[column])])));meta=payload.meta;save();refreshOptions();resetFilters();render();toast('已還原此 email 的備份：'+rows.length.toLocaleString()+' 部作品')}catch(error){toast('雲端還原失敗：'+error.message)}finally{button.disabled=false}})
$('results').addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const record=rows.find(item=>keyFor(item)===button.dataset.key);if(!record)return;meta[button.dataset.key]=meta[button.dataset.key]||{};meta[button.dataset.key][button.dataset.action]=!meta[button.dataset.key][button.dataset.action];save();render()})
document.querySelectorAll('.filter-setting').forEach(setting=>setting.querySelector('.favorite-btn').addEventListener('click',()=>{const favorites=filterFavorites(),key=setting.dataset.setting;if(favorites.has(key))favorites.delete(key);else favorites.add(key);try{localStorage.setItem(FAVKEY,JSON.stringify([...favorites]))}catch(error){toast('儲存篩選收藏失敗：'+error.message)}applyFilterFavorites()}))
$('filtersToggle').addEventListener('click',()=>{settingsExpanded=!settingsExpanded;$('filtersToggle').textContent=settingsExpanded?'收合設定':'展開設定';$('filtersToggle').setAttribute('aria-expanded',String(settingsExpanded));applyFilterFavorites()})
;['search','typeFilter','actorFilter','themeFilter','languageFilter','yearFilter','favOnly','watchedOnly','unwatchedOnly','sortSelect'].forEach(id=>$(id).addEventListener('input',render))
$('resetBtn').addEventListener('click',resetFilters)
$('viewBtn').addEventListener('click',()=>{listView=!listView;$('viewBtn').textContent=listView?'切換卡片':'切換列表';$('results').style.gridTemplateColumns=listView?'1fr':''})
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;$('installBtn').classList.remove('hidden')})
$('installBtn').addEventListener('click',async()=>{if(!installPrompt)return;await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').classList.add('hidden')})
load();applyFilterFavorites();refreshOptions();render()
if(/^https?:$/.test(location.protocol)){if(!rows.length)loadBundledCsv(false).catch(error=>toast('自動載入本機 CSV 失敗：'+error.message));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(error=>toast('離線快取初始化失敗：'+error.message)))}
</script>
</body>
</html>
